[project]
name = "gtfs-zone-static-importer"
version = "0.1.0"
requires-python = ">=3.13"
description = "Celery worker that builds and publishes GTFS-RT schedule updates"
dependencies = [
    "celery[redis]>=5.4",
    "celery-singleton>=0.3",
    "httpx>=0.27",
    "sqlmodel>=0.0.21",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5",
    "gtfs-zone-db-models",
]

[tool.uv.sources]
gtfs-zone-db-models = { git = "https://github.com/gtfs-zone/gtfs-zone-db-models.git", tag = "v0.2.0" }

[dependency-groups]
dev = [
    "commitizen",
    "moto[s3]>=5.0",
    "pre-commit",
    "pytest>=8.0",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtfs_zone_static_importer"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "TC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests take fixtures by name and return nothing worth annotating.
"tests/**" = ["ANN"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true

[tool.pytest.ini_options]
testpaths = ["tests"]
