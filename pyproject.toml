[project]
name = "schedule-foamer"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "celery[redis]>=5.4",
    "celery-singleton>=0.3",
    "httpx>=0.27",
    "sqlmodel>=0.0.21",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.6",
    "railroad-club",
]

[tool.uv.sources]
railroad-club = { git = "https://git.kcfam.us/gtfs.zone/railroad-club.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[dependency-groups]
dev = ["commitizen", "pre-commit", "ruff"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
